<!doctype html><html><head><meta charset="utf-8"><title>SeatCrew</title>
<link rel="stylesheet" href="/neon.css">
<style>
body{margin:0;font-size:14px}.wrap{max-width:1080px;margin:0 auto;padding:28px}
.hero{display:flex;gap:22px;align-items:center;padding:20px 24px;flex-wrap:wrap}
.mascot{width:92px;height:92px;filter:drop-shadow(0 0 18px #3dffa033)}.mascot .eye{animation:eb 5s infinite;transform-box:fill-box;transform-origin:center}@keyframes eb{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
h1{font:800 clamp(28px,3.4vw,44px)/1 var(--sans);margin:0;display:flex;align-items:center;gap:12px}h1 .ver{font:600 11px var(--mono);color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:2px 7px}
.st{margin:8px 0 6px}.st b{color:var(--acc)}#sub{color:var(--dim);letter-spacing:.04em}
.hstats{margin-left:auto;display:grid;grid-template-columns:repeat(3,auto);gap:4px 30px}.hstats .l{color:var(--dim);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.art{width:100%;height:70px;margin-top:6px}.art .w{stroke:var(--acc);stroke-width:2;stroke-dasharray:3 9;animation:nxDash 1.2s linear infinite;opacity:.8}.art circle.n{fill:var(--pn2);stroke:var(--acc);stroke-width:2}.art circle.x{stroke:var(--bad)}.art text{fill:var(--dim);font:700 10px var(--mono);text-anchor:middle;letter-spacing:.1em}
.dim{color:var(--dim)}.card{margin:16px 0;padding:18px}
h2{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.wf{border:1px solid var(--ln);border-radius:12px;padding:16px;cursor:pointer;background:linear-gradient(180deg,var(--pn2),var(--pn));transition:all .3s;position:relative;overflow:hidden}
.wf:hover,.wf:focus{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 24px #3dffa033;transform:translateY(-2px);outline:none}.wf.last{border-color:#3dffa088}
.wf b{font:800 17px var(--sans);color:var(--fg)}.wf .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:#081018;margin-bottom:10px;box-shadow:0 0 16px #3dffa044}
.wf .go{position:absolute;right:14px;top:16px;color:var(--acc);font-weight:700;opacity:0;transition:opacity .3s}.wf:hover .go{opacity:1}
.tag{font:700 10px var(--mono);border:1px solid currentColor;border-radius:5px;padding:1px 6px;margin-left:8px;color:var(--blue);text-transform:uppercase;vertical-align:middle}.tag.lastt{color:var(--acc)}
label{display:block;margin:10px 0 4px;color:var(--dim)}select,input{background:#05080d;color:var(--fg);border:1px solid var(--ln);padding:8px;border-radius:8px;width:100%;box-sizing:border-box;font:inherit}
button{background:var(--acc);color:#04140a;border:0;padding:9px 16px;border-radius:8px;font:inherit;font-weight:bold;cursor:pointer;margin-top:14px;box-shadow:0 0 16px #3dffa044;transition:filter .2s}button:hover{filter:brightness(1.1)}
button.ghost{background:none;color:var(--dim);border:1px solid var(--ln);box-shadow:none}.err{color:var(--bad)}.row{display:flex;gap:12px}.row>*{flex:1}
body[data-theme=light] select,body[data-theme=light] input{background:#fff}
</style></head><body><div class="wrap">
<div class="nx-card hero"><svg class="mascot" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="mg" cx="40%" cy="30%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b9c6d8"/></radialGradient></defs>
 <line x1="50" y1="6" x2="50" y2="18" stroke="#3dffa0" stroke-width="3"/><circle cx="50" cy="6" r="4" fill="#3dffa0"/><rect x="12" y="18" width="76" height="64" rx="24" fill="url(#mg)"/><rect x="22" y="34" width="56" height="30" rx="14" fill="#0b1220"/>
 <rect class="eye" x="35" y="41" width="8" height="16" rx="4" fill="#3dffa0"/><rect class="eye" x="57" y="41" width="8" height="16" rx="4" fill="#3dffa0"/><rect x="26" y="82" width="48" height="10" rx="5" fill="#8fa0b8"/></svg>
 <div><h1>SeatCrew <span class="ver" id="ver"></span></h1><div class="st"><span class="nx-dot"></span> <b id="ready"></b> · <span id="clock"></span></div><div id="sub"></div></div>
 <div class="hstats"><div><div class="nx-big" id="nWf">0</div><div class="l" id="lWf"></div></div><div><div class="nx-big" style="color:var(--blue)">5</div><div class="l" id="lLn"></div></div><div><div class="nx-big" style="color:var(--acc)">0</div><div class="l" id="lKey"></div></div></div>
 <svg class="art" viewBox="0 0 1000 70" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path class="w" d="M90 30 H910"/>
  <g><circle class="n" cx="90" cy="30" r="12"/><text x="90" y="62">IDEA</text></g><g><circle class="n" cx="300" cy="30" r="12"/><text x="300" y="62">CHECK</text></g><g><circle class="n x" cx="500" cy="30" r="12"/><text x="500" y="62">CHECK</text></g><g><circle class="n" cx="700" cy="30" r="12"/><text x="700" y="62">HUMAN</text></g><g><circle class="n" cx="910" cy="30" r="12"/><text x="910" y="62">DONE</text></g>
  <circle class="nx-packet" r="4"><animateMotion dur="3s" repeatCount="indefinite" path="M90 30 H910"/></circle><circle class="nx-packet" r="4"><animateMotion dur="3s" begin="-1.5s" repeatCount="indefinite" path="M90 30 H910"/></circle></svg></div>
<div class="card nx-card" id="wizard" style="display:none"><h2 id="wzT"></h2><p class="dim" id="wzP"></p>
 <label id="lLang"></label><select id="lang"></select>
 <div class="row"><div><label id="lProv"></label><select id="prov"></select></div><div><label id="lKey"></label><input id="key" type="password" autocomplete="off"></div></div>
 <label id="lData"></label><input id="dataIn"><p class="dim" id="dHint"></p>
 <p class="dim" id="wzK"></p><button id="go"></button> <button class="ghost" id="skip"></button> <span id="wzErr" class="err"></span></div>
<div class="card nx-card" id="pick" style="display:none"><h2 id="pkT"></h2><div class="grid" id="wfs"></div><p class="dim" id="pkH"></p><span id="pkErr" class="err"></span>
 <button class="ghost" id="redo"></button></div>
<div class="card nx-card" id="dcard" style="display:none"><h2 id="dT"></h2><p class="dim"><span id="dCur"></span> <span class="tag" id="dSrc"></span></p><p class="dim" id="dHint2"></p>
 <div id="dForm"><input id="dataNew" placeholder="D:\SeatCrewData"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="mv" checked style="width:auto"> <span id="mvL"></span></label>
 <button id="chg"></button> <span id="dMsg"></span></div><p class="dim" id="envLock" style="display:none"></p></div>
<p class="dim" id="foot"></p><button class="ghost" id="anim" style="margin-top:0"></button></div>
<span hidden id="lKeyHolder"></span>
<script>
const T={en:{anim:"animations",on:"on",off:"off",ready:"ready",lWf:"workflows",lLn:"languages",lKey:"AI keys set",sub:"Multi-AI seat workflows - every job gets a seat, every item walks a check chain.",wzT:"Welcome - first-time setup",wzP:"Pick a language. An AI key is optional: every workflow also runs on plain rules.",lLang:"Language",lProv:"AI provider (optional)",lKey:"API key (stays on this computer)",wzK:"You can change seats, providers and keys later in each dashboard.",go:"Save & continue",skip:"Skip - rules only",pkT:"Open a workflow",pkH:"Your own workflows go in the data folder's workflows/ folder (seatcrew new <name> --dir workflows).",redo:"Setup again",none:"rules only",example:"example",mine:"mine",d:{trading:"Paper-trading terminal - 8 seats, strategy lab (flagship showcase)",content_review:"Topic → draft → fact-check → policy → human approval → publish",support_triage:"Ticket → privacy → reply draft → tone → approval (YAML only)"},data:"Data folder",lData:"Data folder",dHint:"Settings, profiles, history and keys are stored here. Any folder works, e.g. D:\\SeatCrewData.",chg:"Change data folder",mv:"move my existing data there",envLock:"Set by the SEATCREW_DATA_DIR environment variable - change it there.",dOk:"Data folder changed",src:{default:"default",custom:"custom",portable:"portable",env:"env",fixed:"--home"}},
"zh-CN":{anim:"动画效果",on:"开",off:"关",ready:"就绪",lWf:"个工作流",lLn:"种语言",lKey:"个 AI 密钥",sub:"多 AI 席位工作流 - 每个岗位一个席位,每个事项走一遍检查链。",wzT:"欢迎 - 首次设置",wzP:"选择语言。AI 密钥可选:所有工作流都能只靠规则运行。",lLang:"语言",lProv:"AI 服务商(可选)",lKey:"API 密钥(只保存在本机)",wzK:"之后可以在每个看板里修改席位、服务商和密钥。",go:"保存并继续",skip:"跳过 - 只用规则",pkT:"打开一个工作流",pkH:"自己的工作流放在数据文件夹的 workflows/ 里。",redo:"重新设置",none:"只用规则",example:"示例",mine:"我的",d:{trading:"模拟交易终端 - 8 个席位 + 策略实验室(成品展示)",content_review:"选题 → 草稿 → 事实核查 → 合规 → 人工审批 → 发布",support_triage:"工单 → 隐私 → 回复草稿 → 语气 → 审批(纯 YAML)"},data:"数据文件夹",lData:"数据文件夹",dHint:"设置、配置方案、历史记录和密钥都存在这里。可以选任意文件夹,例如 D:\\SeatCrewData。",chg:"更改数据文件夹",mv:"把现有数据一起搬过去",envLock:"由环境变量 SEATCREW_DATA_DIR 指定,请在那里修改。",dOk:"数据文件夹已更改"},
"zh-TW":{anim:"動畫效果",on:"開",off:"關",ready:"就緒",lWf:"個流程",lLn:"種語言",lKey:"個 AI 金鑰",sub:"多 AI 席位工作流程 - 每個職位一個席位,每個項目走一遍檢查鏈。",wzT:"歡迎 - 首次設定",wzP:"選擇語言。AI 金鑰可選:所有流程都能只靠規則執行。",lLang:"語言",lProv:"AI 服務商(可選)",lKey:"API 金鑰(只存在本機)",wzK:"之後可在每個看板修改席位、服務商與金鑰。",go:"儲存並繼續",skip:"略過 - 只用規則",pkT:"開啟工作流程",pkH:"自己的流程放在資料夾的 workflows/ 裡。",redo:"重新設定",none:"只用規則",example:"範例",mine:"我的",d:{},data:"資料夾",lData:"資料夾",dHint:"設定、設定檔、紀錄與金鑰都存在這裡。可選任意資料夾,例如 D:\\SeatCrewData。",chg:"變更資料夾",mv:"把現有資料一併搬移",envLock:"由環境變數 SEATCREW_DATA_DIR 指定,請在該處修改。",dOk:"資料夾已變更"},
ja:{anim:"アニメーション",on:"オン",off:"オフ",ready:"準備完了",lWf:"ワークフロー",lLn:"言語",lKey:"AI キー",sub:"マルチ AI シート型ワークフロー - 仕事ごとに席、項目ごとにチェックチェーン。",wzT:"ようこそ - 初回設定",wzP:"言語を選択。AI キーは任意です(ルールだけでも動きます)。",lLang:"言語",lProv:"AI プロバイダー(任意)",lKey:"API キー(この PC にのみ保存)",wzK:"席・プロバイダー・キーは後で各ダッシュボードで変更できます。",go:"保存して続行",skip:"スキップ - ルールのみ",pkT:"ワークフローを開く",pkH:"自作ワークフローはデータフォルダの workflows/ に置きます。",redo:"再設定",none:"ルールのみ",example:"例",mine:"自作",d:{},data:"データフォルダ",lData:"データフォルダ",dHint:"設定・プロファイル・履歴・キーはここに保存されます。例: D:\\SeatCrewData",chg:"データフォルダを変更",mv:"既存データも移動する",envLock:"環境変数 SEATCREW_DATA_DIR で指定されています。",dOk:"データフォルダを変更しました"},
es:{anim:"animaciones",on:"sí",off:"no",ready:"listo",lWf:"flujos",lLn:"idiomas",lKey:"claves IA",sub:"Flujos con varios puestos de IA - cada tarea tiene un puesto, cada elemento pasa una cadena de controles.",wzT:"Bienvenido - configuración inicial",wzP:"Elige idioma. La clave de IA es opcional: todo funciona también solo con reglas.",lLang:"Idioma",lProv:"Proveedor de IA (opcional)",lKey:"Clave API (queda en este equipo)",wzK:"Puedes cambiar puestos, proveedores y claves luego en cada panel.",go:"Guardar y continuar",skip:"Omitir - solo reglas",pkT:"Abrir un flujo",pkH:"Tus flujos van en la carpeta workflows/ de los datos.",redo:"Configurar de nuevo",none:"solo reglas",example:"ejemplo",mine:"mío",d:{},data:"Carpeta de datos",lData:"Carpeta de datos",dHint:"Aquí se guardan ajustes, perfiles, historial y claves. Sirve cualquier carpeta, p. ej. D:\\SeatCrewData.",chg:"Cambiar carpeta de datos",mv:"mover mis datos existentes",envLock:"Definida por la variable SEATCREW_DATA_DIR; cámbiala allí.",dOk:"Carpeta de datos cambiada"}};
let H,L="en";const $=id=>document.getElementById(id);
const tr=k=>(T[L]&&T[L][k])||T.en[k];
async function api(p,b){const r=await fetch(p,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{});return r.json()}
function paint(){for(const k of["sub","wzT","wzP","lLang","lProv","lKey","wzK","go","skip","pkT","pkH","redo","lData","dHint","chg","envLock","ready","lWf","lLn","lKey"])$(k).textContent=tr(k);
 $("prov").options[0].textContent=tr("none");
 const C=["#3dffa0","#ffc94d","#5cc8ff","#b18cff","#ff9a3d","#ff4f6d"],G=["◆","▲","●","■","✦","⬢"];
 $("wfs").innerHTML=H.workflows.map((w,i)=>`<div class="wf nx-in ${w.name==H.last?"last":""}" tabindex="0" data-wf="${w.name}" style="animation-delay:${i*60}ms"><div class="ic" style="background:${C[i%C.length]}">${G[i%G.length]}</div><span class="go">OPEN →</span><b>${w.name}</b><span class="tag">${tr(w.kind)}</span>${w.name==H.last?`<span class="tag lastt">last</span>`:""}<div class="dim" style="margin-top:8px">${(T[L].d||{})[w.name]||T.en.d[w.name]||""}</div></div>`).join("");
 $("ver").textContent="v"+H.version;$("nWf").textContent=H.workflows.length;document.querySelectorAll(".hstats .nx-big")[2].textContent=Object.values(H.keys||{}).filter(Boolean).length;
 document.querySelectorAll("[data-wf]").forEach(e=>{e.onclick=()=>openWf(e.dataset.wf);e.onkeydown=k=>{if(k.key=="Enter")openWf(e.dataset.wf)}});
 $("dHint2").textContent=tr("dHint");$("dT").textContent=tr("data");$("mvL").textContent=tr("mv");
 $("dCur").textContent=H.data_dir;$("dSrc").textContent=(T.en.src[H.data_source]||H.data_source);const lock=H.data_source=="env"||H.data_source=="fixed";
 $("dForm").style.display=lock?"none":"block";$("envLock").style.display=lock?"block":"none";$("lData").style.display=$("dataIn").style.display=lock?"none":"block";
 document.body.classList.toggle("noanim",H.animations===false||matchMedia("(prefers-reduced-motion: reduce)").matches);$("anim").textContent="✨ "+tr("anim")+": "+(H.animations===false?tr("off"):tr("on"));
 $("foot").textContent=`v${H.version} · ${tr("data")}: ${H.data_dir}`}
async function changeData(){$("dMsg").className="";$("dMsg").textContent="…";const r=await api("/api/datadir",{path:$("dataNew").value,move:$("mv").checked});
 if(!r.ok){$("dMsg").className="err";$("dMsg").textContent=r.error;return}H=await api("/api/home");paint();$("dMsg").textContent="✓ "+tr("dOk")+": "+r.data_dir}
async function openWf(n){$("pkErr").textContent="…";const r=await api("/api/open",{workflow:n});if(r.ok)location.href=r.url;else $("pkErr").textContent=r.error}
function show(w){$("wizard").style.display=w?"block":"none";$("pick").style.display=$("dcard").style.display=w?"none":"block"}
async function setup(withKey){const r=await api("/api/setup",{language:$("lang").value,provider:withKey?$("prov").value:null,api_key:withKey?$("key").value:"",data_dir:$("dataIn").value.trim()==H.data_dir?"":$("dataIn").value.trim()});
 if(!r.ok){$("wzErr").textContent=r.error;return}$("key").value="";H=await api("/api/home");show(false);paint()}
(async()=>{H=await api("/api/home");L=H.language;
 $("lang").innerHTML=Object.entries(H.languages).map(([c,n])=>`<option value="${c}">${n}</option>`).join("");$("lang").value=L;
 $("prov").innerHTML=`<option value=""></option>`+Object.entries(H.providers).filter(([k,v])=>v.key_env).map(([k,v])=>`<option value="${k}">${v.label}${H.keys[k]?" ✓":""}</option>`).join("");
 $("lang").onchange=()=>{L=$("lang").value;paint()};$("go").onclick=()=>setup(true);$("skip").onclick=()=>setup(false);$("redo").onclick=()=>show(true);$("chg").onclick=changeData;$("anim").onclick=async()=>{await api("/api/prefs",{animations:H.animations===false});H=await api("/api/home");paint()};$("dataIn").value=$("dataNew").value=H.data_dir;
 show(H.first_run);paint()})();
setInterval(()=>{const c=document.getElementById("clock");if(c)c.textContent=new Date().toLocaleTimeString()},1000);
if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)document.body.classList.add("noanim");
</script></body></html>
