<!doctype html><html><head><meta charset="utf-8"><title>SeatCrew</title>
<style>
body{margin:0;background:#0b0f0c;color:#cfe8d5;font:14px ui-monospace,Menlo,Consolas,monospace}
.wrap{max-width:900px;margin:0 auto;padding:32px}
h1{color:#39ff88;margin:0 0 4px;display:flex;align-items:center;gap:12px}h1 img{width:44px;height:44px}
.dim{color:#7a9583}.card{border:1px solid #1f3a29;background:#0f1612;border-radius:6px;padding:18px;margin:18px 0}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#9fc7ad;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.wf{border:1px solid #24563a;border-radius:6px;padding:14px;cursor:pointer;background:#0c1510}
.wf:hover,.wf.last{border-color:#39ff88;box-shadow:0 0 12px #39ff8833}.wf b{color:#39ff88;font-size:15px}
.tag{font-size:11px;border:1px solid #2c5;border-radius:3px;padding:0 4px;margin-left:6px;color:#8d8}
label{display:block;margin:10px 0 4px;color:#9fc7ad}select,input{background:#08100b;color:#cfe8d5;border:1px solid #24563a;padding:7px;border-radius:4px;width:100%;box-sizing:border-box;font:inherit}
button{background:#39ff88;color:#04140a;border:0;padding:9px 16px;border-radius:4px;font:inherit;font-weight:bold;cursor:pointer;margin-top:14px}
button.ghost{background:none;color:#9fc7ad;border:1px solid #24563a}.err{color:#ff6b6b}.row{display:flex;gap:12px}.row>*{flex:1}
</style></head><body><div class="wrap">
<h1><img src="/icon.png" alt="">SeatCrew</h1><div class="dim" id="sub"></div>
<div class="card" id="wizard" style="display:none"><h2 id="wzT"></h2><p class="dim" id="wzP"></p>
 <label id="lLang"></label><select id="lang"></select>
 <div class="row"><div><label id="lProv"></label><select id="prov"></select></div><div><label id="lKey"></label><input id="key" type="password" autocomplete="off"></div></div>
 <label id="lData"></label><input id="dataIn"><p class="dim" id="dHint"></p>
 <p class="dim" id="wzK"></p><button id="go"></button> <button class="ghost" id="skip"></button> <span id="wzErr" class="err"></span></div>
<div class="card" id="pick" style="display:none"><h2 id="pkT"></h2><div class="grid" id="wfs"></div><p class="dim" id="pkH"></p><span id="pkErr" class="err"></span>
 <button class="ghost" id="redo"></button></div>
<div class="card" id="dcard" style="display:none"><h2 id="dT"></h2><p class="dim"><span id="dCur"></span> <span class="tag" id="dSrc"></span></p><p class="dim" id="dHint2"></p>
 <div id="dForm"><input id="dataNew" placeholder="D:\SeatCrewData"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="mv" checked style="width:auto"> <span id="mvL"></span></label>
 <button id="chg"></button> <span id="dMsg"></span></div><p class="dim" id="envLock" style="display:none"></p></div>
<p class="dim" id="foot"></p></div>
<script>
const T={en:{sub:"Multi-AI seat workflows - every job gets a seat, every item walks a check chain.",wzT:"Welcome - first-time setup",wzP:"Pick a language. An AI key is optional: every workflow also runs on plain rules.",lLang:"Language",lProv:"AI provider (optional)",lKey:"API key (stays on this computer)",wzK:"You can change seats, providers and keys later in each dashboard.",go:"Save & continue",skip:"Skip - rules only",pkT:"Open a workflow",pkH:"Your own workflows go in the data folder's workflows/ folder (seatcrew new <name> --dir workflows).",redo:"Setup again",none:"rules only",example:"example",mine:"mine",d:{trading:"Paper-trading terminal - 8 seats, strategy lab (flagship showcase)",content_review:"Topic → draft → fact-check → policy → human approval → publish",support_triage:"Ticket → privacy → reply draft → tone → approval (YAML only)"},data:"Data folder",lData:"Data folder",dHint:"Settings, profiles, history and keys are stored here. Any folder works, e.g. D:\\SeatCrewData.",chg:"Change data folder",mv:"move my existing data there",envLock:"Set by the SEATCREW_DATA_DIR environment variable - change it there.",dOk:"Data folder changed",src:{default:"default",custom:"custom",portable:"portable",env:"env",fixed:"--home"}},
"zh-CN":{sub:"多 AI 席位工作流 - 每个岗位一个席位,每个事项走一遍检查链。",wzT:"欢迎 - 首次设置",wzP:"选择语言。AI 密钥可选:所有工作流都能只靠规则运行。",lLang:"语言",lProv:"AI 服务商(可选)",lKey:"API 密钥(只保存在本机)",wzK:"之后可以在每个看板里修改席位、服务商和密钥。",go:"保存并继续",skip:"跳过 - 只用规则",pkT:"打开一个工作流",pkH:"自己的工作流放在数据文件夹的 workflows/ 里。",redo:"重新设置",none:"只用规则",example:"示例",mine:"我的",d:{trading:"模拟交易终端 - 8 个席位 + 策略实验室(成品展示)",content_review:"选题 → 草稿 → 事实核查 → 合规 → 人工审批 → 发布",support_triage:"工单 → 隐私 → 回复草稿 → 语气 → 审批(纯 YAML)"},data:"数据文件夹",lData:"数据文件夹",dHint:"设置、配置方案、历史记录和密钥都存在这里。可以选任意文件夹,例如 D:\\SeatCrewData。",chg:"更改数据文件夹",mv:"把现有数据一起搬过去",envLock:"由环境变量 SEATCREW_DATA_DIR 指定,请在那里修改。",dOk:"数据文件夹已更改"},
"zh-TW":{sub:"多 AI 席位工作流程 - 每個職位一個席位,每個項目走一遍檢查鏈。",wzT:"歡迎 - 首次設定",wzP:"選擇語言。AI 金鑰可選:所有流程都能只靠規則執行。",lLang:"語言",lProv:"AI 服務商(可選)",lKey:"API 金鑰(只存在本機)",wzK:"之後可在每個看板修改席位、服務商與金鑰。",go:"儲存並繼續",skip:"略過 - 只用規則",pkT:"開啟工作流程",pkH:"自己的流程放在資料夾的 workflows/ 裡。",redo:"重新設定",none:"只用規則",example:"範例",mine:"我的",d:{},data:"資料夾",lData:"資料夾",dHint:"設定、設定檔、紀錄與金鑰都存在這裡。可選任意資料夾,例如 D:\\SeatCrewData。",chg:"變更資料夾",mv:"把現有資料一併搬移",envLock:"由環境變數 SEATCREW_DATA_DIR 指定,請在該處修改。",dOk:"資料夾已變更"},
ja:{sub:"マルチ AI シート型ワークフロー - 仕事ごとに席、項目ごとにチェックチェーン。",wzT:"ようこそ - 初回設定",wzP:"言語を選択。AI キーは任意です(ルールだけでも動きます)。",lLang:"言語",lProv:"AI プロバイダー(任意)",lKey:"API キー(この PC にのみ保存)",wzK:"席・プロバイダー・キーは後で各ダッシュボードで変更できます。",go:"保存して続行",skip:"スキップ - ルールのみ",pkT:"ワークフローを開く",pkH:"自作ワークフローはデータフォルダの workflows/ に置きます。",redo:"再設定",none:"ルールのみ",example:"例",mine:"自作",d:{},data:"データフォルダ",lData:"データフォルダ",dHint:"設定・プロファイル・履歴・キーはここに保存されます。例: D:\\SeatCrewData",chg:"データフォルダを変更",mv:"既存データも移動する",envLock:"環境変数 SEATCREW_DATA_DIR で指定されています。",dOk:"データフォルダを変更しました"},
es:{sub:"Flujos con varios puestos de IA - cada tarea tiene un puesto, cada elemento pasa una cadena de controles.",wzT:"Bienvenido - configuración inicial",wzP:"Elige idioma. La clave de IA es opcional: todo funciona también solo con reglas.",lLang:"Idioma",lProv:"Proveedor de IA (opcional)",lKey:"Clave API (queda en este equipo)",wzK:"Puedes cambiar puestos, proveedores y claves luego en cada panel.",go:"Guardar y continuar",skip:"Omitir - solo reglas",pkT:"Abrir un flujo",pkH:"Tus flujos van en la carpeta workflows/ de los datos.",redo:"Configurar de nuevo",none:"solo reglas",example:"ejemplo",mine:"mío",d:{},data:"Carpeta de datos",lData:"Carpeta de datos",dHint:"Aquí se guardan ajustes, perfiles, historial y claves. Sirve cualquier carpeta, p. ej. D:\\SeatCrewData.",chg:"Cambiar carpeta de datos",mv:"mover mis datos existentes",envLock:"Definida por la variable SEATCREW_DATA_DIR; cámbiala allí.",dOk:"Carpeta de datos cambiada"}};
let H,L="en";const $=id=>document.getElementById(id);
const tr=k=>(T[L]&&T[L][k])||T.en[k];
async function api(p,b){const r=await fetch(p,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{});return r.json()}
function paint(){for(const k of["sub","wzT","wzP","lLang","lProv","lKey","wzK","go","skip","pkT","pkH","redo","lData","dHint","chg","envLock"])$(k).textContent=tr(k);
 $("prov").options[0].textContent=tr("none");
 $("wfs").innerHTML=H.workflows.map(w=>`<div class="wf ${w.name==H.last?"last":""}" data-wf="${w.name}"><b>${w.name}</b><span class="tag">${tr(w.kind)}</span><div class="dim" style="margin-top:6px">${(T[L].d||{})[w.name]||T.en.d[w.name]||""}</div></div>`).join("");
 document.querySelectorAll("[data-wf]").forEach(e=>e.onclick=()=>openWf(e.dataset.wf));
 $("dHint2").textContent=tr("dHint");$("dT").textContent=tr("data");$("mvL").textContent=tr("mv");
 $("dCur").textContent=H.data_dir;$("dSrc").textContent=(T.en.src[H.data_source]||H.data_source);const lock=H.data_source=="env"||H.data_source=="fixed";
 $("dForm").style.display=lock?"none":"block";$("envLock").style.display=lock?"block":"none";$("lData").style.display=$("dataIn").style.display=lock?"none":"block";
 $("foot").textContent=`v${H.version} · ${tr("data")}: ${H.data_dir}`}
async function changeData(){$("dMsg").className="";$("dMsg").textContent="…";const r=await api("/api/datadir",{path:$("dataNew").value,move:$("mv").checked});
 if(!r.ok){$("dMsg").className="err";$("dMsg").textContent=r.error;return}H=await api("/api/home");paint();$("dMsg").textContent="✓ "+tr("dOk")+": "+r.data_dir}
async function openWf(n){$("pkErr").textContent="…";const r=await api("/api/open",{workflow:n});if(r.ok)location.href=r.url;else $("pkErr").textContent=r.error}
function show(w){$("wizard").style.display=w?"block":"none";$("pick").style.display=$("dcard").style.display=w?"none":"block"}
async function setup(withKey){const r=await api("/api/setup",{language:$("lang").value,provider:withKey?$("prov").value:null,api_key:withKey?$("key").value:"",data_dir:$("dataIn").value.trim()==H.data_dir?"":$("dataIn").value.trim()});
 if(!r.ok){$("wzErr").textContent=r.error;return}$("key").value="";H=await api("/api/home");show(false);paint()}
(async()=>{H=await api("/api/home");L=H.language;
 $("lang").innerHTML=Object.entries(H.languages).map(([c,n])=>`<option value="${c}">${n}</option>`).join("");$("lang").value=L;
 $("prov").innerHTML=`<option value=""></option>`+Object.entries(H.providers).filter(([k,v])=>v.key_env).map(([k,v])=>`<option value="${k}">${v.label}${H.keys[k]?" ✓":""}</option>`).join("");
 $("lang").onchange=()=>{L=$("lang").value;paint()};$("go").onclick=()=>setup(true);$("skip").onclick=()=>setup(false);$("redo").onclick=()=>show(true);$("chg").onclick=changeData;$("dataIn").value=$("dataNew").value=H.data_dir;
 show(H.first_run);paint()})();
</script></body></html>
