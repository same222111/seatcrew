<!doctype html><html><head><meta charset="utf-8"><title>SeatCrew</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Generic SeatCrew dashboard. It knows nothing about any domain: everything is drawn from /api/config (definition)
     and /api/state (snapshot). All strings come from /api/locale/<code> (core + workflow locales). No build step. -->

<style>
*{box-sizing:border-box}body{margin:0;font-size:13px;line-height:1.45}
header{display:flex;gap:14px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--ln);background:#0a0e15cc;backdrop-filter:blur(6px);flex-wrap:wrap}
header b{color:var(--acc);font-size:15px}.pill{border:1px solid var(--ln);padding:1px 8px;border-radius:10px;color:var(--dim)}
nav{margin-left:auto}nav button{background:none;border:1px solid var(--ln);color:var(--dim);padding:4px 12px;cursor:pointer;font:inherit}
nav button{border-radius:7px;margin-left:4px;transition:all .25s}nav button.act{color:var(--bg);background:var(--acc);border-color:var(--acc);box-shadow:var(--glow) #3dffa055}
main{padding:12px}.tab{display:none}.tab.act{display:block}.grid{display:grid;gap:12px}.g2{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
.pn{background:linear-gradient(180deg,var(--pn2),var(--pn));border:1px solid var(--ln);border-radius:var(--r);padding:12px}.pn h3{margin:0 0 8px;font-size:12px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.seat{min-width:0;border:1px solid var(--ln);padding:8px;position:relative;min-height:84px;background:#0d140f}.seat>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .code{font-weight:bold;font-size:15px;letter-spacing:.05em}.seat .job{color:var(--dim)}.seat .ai{color:var(--blue);font-size:11px}.seat .st{color:var(--warn);font-size:11px}
.seat .l{color:var(--dim);font-size:11px}.seat .dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:#2a3a2e}
.seat.on .dot{background:var(--acc);box-shadow:0 0 8px var(--acc)}.seat.on{border-color:var(--acc)}.seat.chief{background:#17110a;border-color:var(--or)}.seat.chief .code{color:var(--or)}
.seat .tag{font-size:10px;border:1px solid var(--ln);padding:0 4px;margin-left:4px;color:var(--warn)}
.runner{color:var(--or);text-align:center;margin-top:8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.items{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.it{min-width:250px;max-width:300px;border:1px solid var(--ln);border-radius:10px;padding:10px;background:var(--pn2)}
.it h4{margin:0 0 6px;font-size:12px}.tl{position:relative;margin:8px 0 0 10px;padding-left:18px;border-left:3px solid var(--or)}
.tl .st{position:relative;margin:0 0 10px}.tl .st:before{content:"";position:absolute;left:-26px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--or)}
.tl .st.bad:before{background:var(--bad)}.tl .st.wait:before{background:var(--warn);box-shadow:0 0 8px var(--warn)}.tl .st.pend{color:#3a4a3e}.tl .st.pend:before{background:#2a3a2e}
.tl .ok{color:var(--dim)}.tl .bad b,.stat.bad{color:var(--bad)}.tl .wait b,.stat.wait{color:var(--warn)}.stat.good{color:var(--acc)}.tl .rs{font-size:11px;color:var(--dim);white-space:pre-wrap;word-break:break-word}
#log{height:300px;overflow:auto;font-size:12px}#log div{white-space:pre-wrap;border-bottom:1px dotted #ffffff0d;padding:1px 0}#log div.nx-in{animation:nxIn .4s ease both}
.k-CHECK_OK{color:var(--or)}.k-CHECK_BLOCKED,.k-ERROR,.k-AI-ERR{color:var(--bad)}.k-AI{color:var(--blue)}.k-WAITING,.k-HOLD{color:var(--warn)}
table{border-collapse:collapse;width:100%}td,th{padding:3px 6px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--dim);font-weight:normal}
input,select,textarea{border-radius:6px;background:#05080d;color:var(--fg);border:1px solid var(--ln);padding:4px 6px;font:inherit}textarea{width:100%;height:58px}
button.b{border-radius:7px;background:#0f2a1f;color:var(--acc);border:1px solid var(--acc);padding:4px 12px;cursor:pointer;font:inherit}button.b:hover{background:var(--acc);color:var(--bg)}
button.no{background:#3a1212;color:var(--bad);border-color:var(--bad)}button.sm{padding:2px 8px;font-size:12px}label{color:var(--dim)}.dim{color:var(--dim)}
.agent{border:1px solid var(--ln);padding:6px 8px;margin-bottom:6px}.agent .n{color:var(--acc);font-weight:bold}

.mono{font-family:var(--mono)}.acc{color:var(--acc)}.good{color:var(--acc)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.hero{display:flex;gap:22px;align-items:center;padding:16px 22px;margin-bottom:12px;flex-wrap:wrap}
.mascot{width:84px;height:84px;filter:drop-shadow(0 0 16px #3dffa033)}.mascot .eye{animation:nxBlinkEye 5s infinite;transform-box:fill-box;transform-origin:center}.mascot .ant{animation:nxPulse 1.4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes nxBlinkEye{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.hero-name{font:800 clamp(22px,2.6vw,34px)/1.1 var(--sans);letter-spacing:-.01em}.hero-name .ver{font:600 11px var(--mono);color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:2px 7px;vertical-align:middle}
.hero-st{margin:6px 0;font-size:14px}.hero-st b{color:var(--acc)}.hero-chip{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);border:1px solid #5cc8ff55;background:#5cc8ff12;border-radius:6px;padding:3px 9px;max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagline{margin-top:6px;letter-spacing:.06em}
.hero-stats{margin-left:auto;display:grid;grid-template-columns:repeat(4,auto);gap:6px 30px;text-align:left}.hero-stats .lbl{color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.dgrid{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:12px}@media(max-width:1250px){.dgrid{grid-template-columns:280px minmax(0,1fr)}.right{grid-column:1/-1}}@media(max-width:800px){.dgrid{grid-template-columns:1fr}}
.col{padding:12px}.center,.right{display:flex;flex-direction:column;gap:12px;min-width:0}
.scard{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;align-items:center;padding:10px;border-radius:10px;border:1px solid transparent;margin-bottom:6px;transition:all .35s}
.scard:hover{border-color:var(--ln);background:#ffffff05}.scard .ic{grid-row:span 3;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;color:#0b0f14;background:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent)}
.scard .nm{font:700 14px var(--sans);letter-spacing:.04em}.scard .jb{grid-column:2/4;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .ln{grid-column:2/4;font-size:11px;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard.live{border-color:#5cc8ff66;background:#5cc8ff0c;box-shadow:inset 0 0 18px #5cc8ff14}.scard.block{border-color:#ff4f6d55;background:#ff4f6d0a}
.flowcard{padding:12px 14px;position:relative}
.qm{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--dim);color:var(--dim);font:700 10px var(--sans);cursor:help;margin-left:6px;vertical-align:middle}.qm:hover{border-color:var(--acc);color:var(--acc)}
.who{margin-top:12px;padding:14px 16px}.who .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;align-items:stretch}.who .st{position:relative;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--pn2);margin-right:26px}
.who .st:last-child{margin-right:0}.who .st:not(:last-child)::after{content:'→';position:absolute;right:-21px;top:50%;transform:translateY(-50%);color:var(--acc);font-weight:800}
.who .st b{display:block;font:800 13px var(--sans);letter-spacing:.06em;color:var(--c,var(--acc));margin-bottom:4px}.who .st .d{color:var(--dim);font-size:12px;line-height:1.4}.who .st .n{font:800 22px var(--sans);color:var(--c,var(--acc));opacity:.35;position:absolute;right:10px;top:4px}
.who .ai{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.who .ai span{font-size:10.5px;border:1px solid var(--ln);border-radius:6px;padding:1px 6px}.who .ai span.on{border-color:var(--blue);color:var(--blue)}
@media(max-width:900px){.who .steps{grid-template-columns:1fr 1fr;gap:10px}.who .st{margin-right:0}.who .st::after{display:none}}
body.simple .adv{display:none!important}#simpleBtn.on{border-color:var(--acc);color:var(--acc)}.fp{color:var(--fg);letter-spacing:.1em}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:6px}
.chip{border:1px solid var(--ln);border-radius:9px;padding:7px 10px;cursor:pointer;transition:all .3s;position:relative;min-width:0}.chip b{font:700 13px var(--sans);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .s{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.chip:after{content:"";position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--dim)}
.chip.ok{border-color:#3dffa055}.chip.ok:after{background:var(--acc)}.chip.bad{border-color:#ff4f6d66}.chip.bad:after{background:var(--bad)}.chip.wait{border-color:#ffc94d77}.chip.wait:after{background:var(--warn)}
.chip.sel{box-shadow:0 0 0 1px var(--acc),var(--glow) #3dffa033}
.flow{position:relative;aspect-ratio:1000/230;max-height:260px;margin:0 auto}#motionBtn.off{opacity:.5;text-decoration:line-through}.flow svg{width:100%;height:100%;overflow:visible}
.flow .wire{stroke:var(--ln);stroke-width:2;fill:none}.flow .wire.ok{stroke:var(--acc);stroke-dasharray:3 9;animation:nxDash 1.2s linear infinite;filter:drop-shadow(0 0 4px #3dffa088)}
.flow .wire.bad{stroke:var(--bad);stroke-dasharray:2 7;opacity:.7}.flow .wire.wait{stroke:var(--warn);stroke-dasharray:3 9;animation:nxDash 2s linear infinite}
.flow .node circle.core{fill:var(--pn2);stroke:var(--ln);stroke-width:3;transition:all .4s}.flow .node text{fill:var(--dim);font:700 11px var(--mono);letter-spacing:.1em;text-anchor:middle}
.flow .node .glyph{font:700 20px var(--sans);fill:var(--dim)}.flow .node .sub{font:500 10px var(--mono);letter-spacing:.02em}
.flow .node.ok circle.core{stroke:var(--acc);filter:drop-shadow(0 0 10px #3dffa077)}.flow .node.ok .glyph,.flow .node.ok text.lbl{fill:var(--acc)}
.flow .node.bad circle.core{stroke:var(--bad);fill:#2a0b13;filter:drop-shadow(0 0 16px #ff4f6daa)}.flow .node.bad .glyph,.flow .node.bad text.lbl{fill:var(--bad)}
.flow .node.wait circle.core{stroke:var(--warn);filter:drop-shadow(0 0 12px #ffc94d88)}.flow .node.wait .glyph,.flow .node.wait text.lbl{fill:var(--warn)}
.flow .ring{fill:none;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:nxRing 1.8s ease-out infinite}.flow .ring.r2{animation-delay:.9s}
.flow .node.bad .ring{stroke:var(--bad)}.flow .node.wait .ring{stroke:var(--warn)}.flow .node.ok .ring{stroke:var(--acc)}
.nx-packet{fill:var(--acc);filter:drop-shadow(0 0 6px var(--acc))}
body[data-theme=light] .flow .node.bad circle.core{fill:#ffe9ed}body[data-theme=light] .hero-name{color:var(--fg)}body[data-theme=light] .mascot rect[fill="#0b1220"]{fill:#132033}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media(max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{padding:10px 12px;min-width:0}.tile .tv{font:700 24px var(--sans);font-variant-numeric:tabular-nums}.tile .ts{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-bad{border-color:#ff4f6d55}.t-bad .nx-h,.t-bad .tv{color:var(--bad)}.t-vio{border-color:#b18cff55}.t-vio .nx-h{color:var(--vio)}.t-or{border-color:#ff9a3d55}.t-or .nx-h{color:var(--or)}.t-blue{border-color:#5cc8ff55}.t-blue .nx-h{color:var(--blue)}.t-blue .tv{color:var(--acc)}
#spark{width:100%;height:34px;display:block}
.detail{padding:14px}.detail .dt{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.detail .dt b{font:800 22px var(--sans)}.detail .kv{display:grid;grid-template-columns:110px 1fr;gap:3px 12px;margin-top:10px;font-size:12.5px}.detail .kv span:nth-child(odd){color:var(--dim)}
.detail .why{margin-top:8px;font-size:12px}.detail .why b{color:var(--or)}
.term{padding:12px;background:#05070b}.term #log{height:300px}body[data-theme=light] .term{background:#fff}
.seat{display:none}.right table{font-size:11.5px}.right td,.right th{padding:3px 4px}
#toast{position:fixed;bottom:16px;right:16px;background:var(--acc);color:var(--bg);padding:8px 14px;display:none}
a.home{display:none;align-items:center;gap:6px;background:var(--acc);color:var(--bg);font-weight:bold;font-size:15px;padding:8px 16px;border-radius:6px;text-decoration:none;box-shadow:0 0 0 2px #0006,0 0 14px #3dff7a55}
a.home:hover,a.home:focus{filter:brightness(1.15);outline:2px solid var(--fg)}.crumb{color:var(--dim);font-size:13px}.crumb a{color:var(--dim)}.crumb b{color:var(--acc)}
.bar2{display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--ln);background:var(--pn);position:sticky;top:0;z-index:5}
details.sec{border:1px solid var(--ln);margin:0 0 8px;padding:6px 10px;background:var(--bg)}details.sec>summary{cursor:pointer;color:var(--acc);font-weight:bold;text-transform:uppercase;letter-spacing:.06em}
fieldset{border:1px solid var(--ln);margin:6px 0;padding:4px 10px}legend{color:var(--blue)}.err{outline:2px solid var(--bad)!important}
#editor .row label{min-width:190px}#editor input:not([type=checkbox]){min-width:220px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto}.modal.open{display:flex}
.modal .box{background:var(--pn);border:1px solid var(--acc);margin:40px 12px;padding:16px;width:min(860px,96vw)}.modal h3{color:var(--acc);margin-top:0}
.chg{font-size:12px;max-height:260px;overflow:auto}.chg td{word-break:break-word}.warn{color:var(--warn)}
body[data-theme=light]{--bg:#f4f7f5;--pn:#ffffff;--ln:#c9d6cd;--fg:#14251a;--dim:#5a6e60;--acc:#0b8a3e;--warn:#a86b00;--bad:#c62828;--blue:#1565c0;--or:#d35400}
body[data-theme=light] header,body[data-theme=light] .seat,body[data-theme=light] .it,body[data-theme=light] input,body[data-theme=light] select,body[data-theme=light] textarea{background:#fff}
body[data-theme=light] .seat.chief{background:#fff4ea}body[data-theme=light] button.b{background:#e6f5ec}body[data-theme=light] button.b:hover{background:var(--acc);color:#fff}
body[data-theme=contrast]{--bg:#000;--pn:#000;--ln:#9a9a9a;--fg:#fff;--dim:#d0d0d0;--acc:#00ff66;--warn:#ffd400;--bad:#ff4040;--blue:#59c8ff}
body[data-theme=contrast] header,body[data-theme=contrast] .seat,body[data-theme=contrast] .it{background:#000}
@media(max-width:520px){header{gap:6px 8px;padding:6px 10px}header #wfname,header #clk,header [data-i18n=app_sub]{display:none}header b{font-size:14px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 nav{margin-left:0;width:100%;display:flex;overflow-x:auto;gap:4px}nav button{margin-left:0;padding:3px 9px;white-space:nowrap;flex:none}header .b.sm{padding:2px 6px}#langSel{max-width:96px}.bar2{padding:6px 10px}.bar2 [data-i18n=back_keys]{display:none}}
:lang(zh) .pn h3,:lang(zh) .hero-chip,:lang(zh) .hero-stats .lbl,:lang(zh) details.sec>summary,:lang(ja) .pn h3{letter-spacing:0;text-transform:none}
:lang(zh) body,:lang(ja) body{line-break:strict;word-break:normal}
.agent .noai{color:var(--dim);font-size:12px;margin:4px 0}
body[data-density=compact] main{padding:6px}body[data-density=compact] .pn{padding:6px}body[data-density=compact] .grid,body[data-density=compact] .seats{gap:5px}
body[data-density=comfy] main{padding:20px}body[data-density=comfy] .pn{padding:16px}body[data-density=comfy] .grid,body[data-density=comfy] .seats{gap:16px}
</style><link rel="stylesheet" href="/neon.css">
</head><body>
<div class="bar2"><a id="homeBtn" class="home" href="#" data-i18n="back_home"></a><span class="crumb"><span id="crumbHome" data-i18n="home"></span> › <b id="crumbWf"></b></span><span class="dim" style="margin-left:auto;font-size:11px" data-i18n="back_keys"></span></div>
<header><b id="title">▌SeatCrew</b><span class="dim" data-i18n="app_sub"></span><span id="wfname" class="pill"></span><span id="clk" class="dim"></span>
<button id="simpleBtn" class="b sm" onclick="toggleSimple()"></button><button id="motionBtn" class="b sm" title="" onclick="toggleMotion()" data-i18n="motion"></button><select id="langSel"></select>
<nav><button data-t="dash" class="act" data-i18n="nav_dash"></button><button data-t="team" data-i18n="nav_seats"></button><button data-t="set" data-i18n="nav_set"></button><button data-t="prof" data-i18n="nav_prof"></button></nav></header>
<main>
<section id="dash" class="tab act">
 <div class="hero nx-card">
  <svg class="mascot" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="mg" cx="40%" cy="30%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9c6d8"/></radialGradient></defs>
   <line x1="50" y1="6" x2="50" y2="18" stroke="var(--acc)" stroke-width="3"/><circle cx="50" cy="6" r="4" fill="var(--acc)" class="ant"/>
   <rect x="12" y="18" width="76" height="64" rx="24" fill="url(#mg)"/><rect x="22" y="34" width="56" height="30" rx="14" fill="#0b1220"/>
   <rect class="eye" x="35" y="41" width="8" height="16" rx="4" fill="var(--acc)"/><rect class="eye" x="57" y="41" width="8" height="16" rx="4" fill="var(--acc)"/>
   <rect x="26" y="82" width="48" height="10" rx="5" fill="#8fa0b8"/></svg>
  <div class="hero-t"><div class="hero-name"><span id="heroTitle">SeatCrew</span> <span class="ver" id="heroVer"></span></div>
   <div class="hero-st"><span class="nx-dot" id="runDot"></span> <b id="runTxt"></b> · <span id="heroClk" class="mono"></span></div>
   <div class="hero-chip" id="heroChip">—</div><div class="dim tagline" data-i18n="tagline"></div></div>
  <div class="hero-stats">
   <div><div class="nx-big" id="stItems">0</div><div class="lbl" data-i18n="stat_items"></div></div>
   <div><div class="nx-big good" id="stPass">0</div><div class="lbl" data-i18n="stat_passed"></div></div>
   <div><div class="nx-big bad" id="stBlock">0</div><div class="lbl" data-i18n="stat_blocked"></div></div>
   <div><div class="nx-big warn" id="stWait">0</div><div class="lbl" data-i18n="stat_waiting"></div></div></div>
 </div>
 <div class="nx-card who" id="whoCard"></div>
 <div class="dgrid">
  <aside class="nx-card col"><div class="nx-h"><span data-i18n="seats_title"></span><span style="margin-left:auto" id="online"></span></div><div id="seats"></div>
   <div class="runner" id="runner"></div><div class="row" style="justify-content:center"><button class="b sm" id="runNow" data-i18n="run_now"></button><span id="cyc" class="dim"></span></div></aside>
  <div class="center">
   <div class="nx-card flowcard"><div class="nx-h"><span data-i18n="live_flow"></span><span id="flowPath" class="fp"></span><span id="flowChk" style="margin-left:auto"></span></div>
    <div class="chips" id="chips"></div><div class="flow" id="flow"></div></div>
   <div class="tiles">
    <div class="nx-card tile t-bad"><div class="nx-h">▲ <span data-i18n="tile_blocked"></span></div><div class="tv" id="tBlock">0</div><div class="ts" id="tBlockS"></div></div>
    <div class="nx-card tile t-vio"><div class="nx-h">◆ <span data-i18n="tile_passrate"></span></div><div class="tv" id="tRate">0%</div><div class="ts" id="tRateS"></div></div>
    <div class="nx-card tile t-or"><div class="nx-h">⬢ <span data-i18n="tile_events"></span></div><div class="tv" id="tEv">0</div><div class="ts" data-i18n="tile_events_s"></div></div>
    <div class="nx-card tile t-blue"><div class="nx-h">◉ <span id="tEqL" data-i18n="tile_equity"></span></div><div class="tv" id="tEq">—</div><canvas id="spark" height="34"></canvas></div></div>
   <div class="nx-card detail" id="detail"></div>
  </div>
  <div class="right">

function countUp(el,to,fmt){fmt=fmt||(v=>Math.round(v).toLocaleString());const from=+el.dataset.v||0;el.dataset.v=to;

function drawSpark(){const c=$('spark');if(!c)return;const w=c.clientWidth||200,h=34,r=devicePixelRatio||1;c.width=w*r;c.height=h*r;const g=c.getContext('2d');g.scale(r,r);g.clearRect(0,0,w,h);

 const skip=new Set(['id','title','chain','status','pending','ts','why','label','subject']);

  ${o.why?`<div class="why"><b>${esc(T('reason'))}:</b> ${esc(o.why)}</div>`:''}${bl?`<div class="why"><b class="bad">${esc(SN(bl.seat))} ✕</b> ${esc(bl.reason)}</div>`:''}`}
async function tick(){if(!DEF||!LOC.app_sub||busy)return;if(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.note)return;let s;try{s=await get('/api/state')}catch(e){return}LAST=s;
 const clk=s.time.replace('T',' ').slice(0,19);$('clk').textContent=clk;$('heroClk').textContent=clk.slice(11);$('runner').textContent=T('runner',{n:s.runner.interval});$('cyc').textContent=` ${T('cycle')} ${s.cycle} · ${T('last')} ${s.last_cycle?s.last_cycle.slice(11,19):'—'}`;
 const on=META.auto_run!==false;$('runDot').classList.toggle('off',!on);$('runTxt').textContent=on?T('running'):T('paused');
 const ev=s.events[s.events.length-1];$('heroChip').textContent=ev?`${ev.agent} · ${ev.kind} ${ev.sym||''} ${ev.msg}`.slice(0,90):'—';
 const its=s.items,nb=its.filter(o=>(o.chain||[]).some(c=>!c.ok)).length,nw=its.filter(o=>o.pending!=null).length,np=its.filter(o=>/^(done|filled)$/.test(o.status)).length;
 countUp($('stItems'),its.length);countUp($('stPass'),np);countUp($('stBlock'),nb);countUp($('stWait'),nw);countUp($('tBlock'),nb);
 const ck=its.reduce((a,o)=>a+(o.chain||[]).length,0);$('tBlockS').textContent=T('checks_run',{n:ck});
 countUp($('tRate'),its.length?Math.round(100*np/Math.max(1,its.length)):0,v=>Math.round(v)+'%');$('tRateS').textContent=`${np}/${its.length}`;countUp($('tEv'),s.events.length);
 const eq=equityOf(s);if(eq!=null){EQH.push(eq);countUp($('tEq'),eq,v=>'$'+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}))}else{EQH.push(np-nb);$('tEqL').textContent=T('tile_net');$('tEq').textContent=(np-nb>=0?'+':'')+(np-nb)}
 if(EQH.length>120)EQH.shift();drawSpark();
 $('flowPath').textContent=' · '+DEF.chain.map(SN).join(' → ');$('flowChk').textContent=T('checked_n',{n:ck});
 if(FOCUS!=null&&!its.find(o=>o.id==FOCUS))FOCUS=null;const fo=its.find(o=>o.id==FOCUS)||its[0];
 const chips=its.slice(0,4).map(o=>{const b=(o.chain||[]).find(c=>!c.ok),c=b?'bad':o.pending!=null?'wait':/^(done|filled)$/.test(o.status)?'ok':'';
  return `<div class="chip ${c} ${fo&&o.id==fo.id?'sel':''}" data-focus="${o.id}"><b>${esc(o.subject||o.title)}</b><span class="s">${esc(b?SN(b.seat)+' ✕ '+b.reason:o.status)}</span></div>`}).join('');
 if(SIG.chips!==chips){$('chips').innerHTML=chips;SIG.chips=chips;document.querySelectorAll('[data-focus]').forEach(e=>e.onclick=()=>{FOCUS=+e.dataset.focus;SIG={};tick()})}
 const fsig=fo?fo.id+':'+JSON.stringify(fo.chain)+fo.pending+LOC.app_sub:'none'+LOC.app_sub;
 if(SIG.flow!==fsig){$('flow').innerHTML=fo?flowSVG(fo):`<div class="dim" style="padding:90px 0;text-align:center">${esc(T('chain_empty'))}</div>`;SIG.flow=fsig;renderDetail(fo)}
 let online=0;const seats=DEF.seats.map((d,i)=>{const a=s.seats[d.name]||{},[cls,bc,bt]=seatState(d.name,s);if(a.active)online++;
  return `<div class="scard ${cls}" data-seat="${d.name}" style="--c:${d.name=='chief'?'var(--or)':PAL[i%PAL.length]}"><div class="ic">${GLYPH[i%GLYPH.length]}</div><div class="nm">${esc(SN(d.name))}<span class="qm" title="${esc(help(d))}">?</span></div><span class="nx-badge ${bc}">${esc(bt)}</span>
   <div class="jb">${esc(job(d))} · AI: ${esc(a.ai||'rules')}</div><div class="ln" title="${esc(a.last||'')}">${esc(a.last||a.status||'')}</div></div>`}).join('');
 if(SIG.seats!==seats){$('seats').innerHTML=seats;SIG.seats=seats}const wc=whoCard(s)+LOC.app_sub;if(SIG.who!==wc){$('whoCard').innerHTML=whoCard(s);SIG.who=wc}$('online').textContent=T('online',{n:DEF.seats.length});
 $('panels').innerHTML=(s.panels||[]).map(p=>`<div class="nx-card pn"><h3>${esc(p.title)}</h3><table><tr>${p.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${p.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`).join('');
 const items=s.items.length?s.items.slice(0,14).map(itemCard).join(''):`<span class="dim">${T('chain_empty')}</span>`;if(SIG.items!==items){$('items').innerHTML=items;SIG.items=items;
 document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>decide(+b.dataset.ap,true,+b.dataset.pending));document.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>decide(+b.dataset.rj,false,+b.dataset.pending))}
 $('logName').textContent=DEF.name+'.log';$('logN').textContent=T('lines',{n:s.events.length});
 const seen=+($('log').dataset.n||0);$('log').innerHTML=s.events.slice().reverse().map((e,i)=>`<div class="k-${e.kind} ${i<s.events.length-seen?'nx-in':''}"><span class=dim>${e.ts.slice(11,19)}</span> ${e.agent.padEnd(9)} ${e.kind.padEnd(13)} ${esc(e.sym)} ${esc(e.msg)}</div>`).join('');$('log').dataset.n=s.events.length}

const lab=k=>LOC['p_'+k]||LOC['set_'+k]||k.replace(/_/g,' ');

 if(p=='language')return `<select ${a} data-ty=s>${Object.entries(META.languages).map(([c,n])=>`<option value="${c}" ${c==v?'selected':''}>${n}</option>`).join('')}</select>`;
 if(p=='display.theme'||p=='display.density')return `<select ${a} data-ty=s>${(p.endsWith('theme')?PROF.themes:PROF.densities).map(x=>`<option ${x==v?'selected':''} value="${x}">${esc(LOC['opt_'+x]||x)}</option>`).join('')}</select>`;
 if(k=='provider'&&p.startsWith('seats.'))return `<select ${a} data-ty=s>${['rules',...Object.keys(META.providers)].map(x=>`<option value="${x}" ${x==v?'selected':''}>${x}${PMK(x)}</option>`).join('')}</select>`;
 if(typeof v=='boolean')return `<input type=checkbox ${a} data-ty=b ${v?'checked':''}>`;
 if(typeof v=='number')return `<input type=number step=any ${a} data-ty=n value="${v}" ${p=='display.font_size'?'min=10 max=22':''}>`;
 if(v===null)return `<input ${a} data-ty=z value="">`;
 if(Array.isArray(v))return v.every(x=>x===null||typeof x!='object')?`<input ${a} data-ty=l data-num="${v.length&&v.every(x=>typeof x=='number')?1:0}" value="${esc(v.join(', '))}" style="width:100%">`:`<textarea ${a} data-ty=j style="height:90px">${esc(JSON.stringify(v,null,1))}</textarea>`;
 if(k=='prompt'||String(v).length>60)return `<textarea ${a} data-ty=s>${esc(v)}</textarea>`;
 return `<input ${a} data-ty=s value="${esc(v)}">`}

 return `<div class="row${adv(p)}${Array.isArray(v)&&v.some(x=>x&&typeof x=='object')?' adv':''}"><label>${esc(lab(k))}</label>${fld(p,v)}</div>`}).join('')}

  return `<details class="sec${adv(k)}" ${i<3?'open':''} data-sec="${k}"><summary>${esc(LOC['sec_'+k]||lab(k))}</summary>${body}</details>`}).join('')}
function collect(){const out={};let bad=0;document.querySelectorAll('#editor [data-pp]').forEach(e=>{e.classList.remove('err');let v;const t=e.dataset.ty;
  try{if(t=='b')v=e.checked;else if(t=='n'){v=e.value.trim()===''?NaN:+e.value;if(!isFinite(v))throw 0;if(e.min&&v<+e.min||e.max&&v>+e.max)throw 0}
   else if(t=='l'){v=e.value.split(',').map(x=>x.trim()).filter(Boolean);if(e.dataset.num=='1'){v=v.map(Number);if(v.some(x=>!isFinite(x)))throw 0}}
   else if(t=='j')v=JSON.parse(e.value);else if(t=='z')v=e.value.trim()||null;else v=e.value}catch(_){bad++;e.classList.add('err');return}
  const ps=e.dataset.pp.split('.');let o=out;ps.slice(0,-1).forEach(x=>o=o[x]=o[x]||{});o[ps.at(-1)]=v});
