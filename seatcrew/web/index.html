<!doctype html><html><head><meta charset="utf-8"><title>SeatCrew</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Generic SeatCrew dashboard. It knows nothing about any domain: everything is drawn from /api/config (definition)
     and /api/state (snapshot). All strings come from /api/locale/<code> (core + workflow locales). No build step. -->
<style>
:root{--bg:#0b0f0c;--pn:#111812;--ln:#1f3324;--fg:#c8f5d0;--dim:#6f8f76;--acc:#3dff7a;--warn:#ffcc4d;--bad:#ff5c5c;--blue:#6cc4ff;--or:#ff8a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{display:flex;gap:14px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--ln);background:#07100a;flex-wrap:wrap}
header b{color:var(--acc);font-size:15px}.pill{border:1px solid var(--ln);padding:1px 8px;border-radius:10px;color:var(--dim)}
nav{margin-left:auto}nav button{background:none;border:1px solid var(--ln);color:var(--dim);padding:4px 12px;cursor:pointer;font:inherit}
nav button.act{color:var(--bg);background:var(--acc);border-color:var(--acc)}
main{padding:12px}.tab{display:none}.tab.act{display:block}.grid{display:grid;gap:12px}.g2{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
.pn{background:var(--pn);border:1px solid var(--ln);padding:10px}.pn h3{margin:0 0 8px;font-size:12px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.seat{min-width:0;border:1px solid var(--ln);padding:8px;position:relative;min-height:84px;background:#0d140f}.seat>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .code{font-weight:bold;font-size:15px;letter-spacing:.05em}.seat .job{color:var(--dim)}.seat .ai{color:var(--blue);font-size:11px}.seat .st{color:var(--warn);font-size:11px}
.seat .l{color:var(--dim);font-size:11px}.seat .dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:#2a3a2e}
.seat.on .dot{background:var(--acc);box-shadow:0 0 8px var(--acc)}.seat.on{border-color:var(--acc)}.seat.chief{background:#17110a;border-color:var(--or)}.seat.chief .code{color:var(--or)}
.seat .tag{font-size:10px;border:1px solid var(--ln);padding:0 4px;margin-left:4px;color:var(--warn)}
.runner{color:var(--or);text-align:center;margin-top:8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.items{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.it{min-width:250px;max-width:300px;border:1px solid var(--ln);padding:8px;background:#0d140f}
.it h4{margin:0 0 6px;font-size:12px}.tl{position:relative;margin:8px 0 0 10px;padding-left:18px;border-left:3px solid var(--or)}
.tl .st{position:relative;margin:0 0 10px}.tl .st:before{content:"";position:absolute;left:-26px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--or)}
.tl .st.bad:before{background:var(--bad)}.tl .st.wait:before{background:var(--warn);box-shadow:0 0 8px var(--warn)}.tl .st.pend{color:#3a4a3e}.tl .st.pend:before{background:#2a3a2e}
.tl .ok{color:var(--dim)}.tl .bad b,.stat.bad{color:var(--bad)}.tl .wait b,.stat.wait{color:var(--warn)}.stat.good{color:var(--acc)}.tl .rs{font-size:11px;color:var(--dim);white-space:pre-wrap;word-break:break-word}
#log{height:300px;overflow:auto;font-size:12px}#log div{white-space:pre-wrap;border-bottom:1px dotted #15241a;padding:1px 0}
.k-CHECK_OK{color:var(--or)}.k-CHECK_BLOCKED,.k-ERROR,.k-AI-ERR{color:var(--bad)}.k-AI{color:var(--blue)}.k-WAITING,.k-HOLD{color:var(--warn)}
table{border-collapse:collapse;width:100%}td,th{padding:3px 6px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--dim);font-weight:normal}
input,select,textarea{background:#060a07;color:var(--fg);border:1px solid var(--ln);padding:4px 6px;font:inherit}textarea{width:100%;height:58px}
button.b{background:#123a1d;color:var(--acc);border:1px solid var(--acc);padding:4px 12px;cursor:pointer;font:inherit}button.b:hover{background:var(--acc);color:var(--bg)}
button.no{background:#3a1212;color:var(--bad);border-color:var(--bad)}button.sm{padding:2px 8px;font-size:12px}label{color:var(--dim)}.dim{color:var(--dim)}
.agent{border:1px solid var(--ln);padding:6px 8px;margin-bottom:6px}.agent .n{color:var(--acc);font-weight:bold}
#toast{position:fixed;bottom:16px;right:16px;background:var(--acc);color:var(--bg);padding:8px 14px;display:none}
a.home{display:none;align-items:center;gap:6px;background:var(--acc);color:var(--bg);font-weight:bold;font-size:15px;padding:8px 16px;border-radius:6px;text-decoration:none;box-shadow:0 0 0 2px #0006,0 0 14px #3dff7a55}
a.home:hover,a.home:focus{filter:brightness(1.15);outline:2px solid var(--fg)}.crumb{color:var(--dim);font-size:13px}.crumb a{color:var(--dim)}.crumb b{color:var(--acc)}
.bar2{display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--ln);background:var(--pn);position:sticky;top:0;z-index:5}
details.sec{border:1px solid var(--ln);margin:0 0 8px;padding:6px 10px;background:var(--bg)}details.sec>summary{cursor:pointer;color:var(--acc);font-weight:bold;text-transform:uppercase;letter-spacing:.06em}
fieldset{border:1px solid var(--ln);margin:6px 0;padding:4px 10px}legend{color:var(--blue)}.err{outline:2px solid var(--bad)!important}
#editor .row label{min-width:190px}#editor input:not([type=checkbox]){min-width:220px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto}.modal.open{display:flex}
.modal .box{background:var(--pn);border:1px solid var(--acc);margin:40px 12px;padding:16px;width:min(860px,96vw)}.modal h3{color:var(--acc);margin-top:0}
.chg{font-size:12px;max-height:260px;overflow:auto}.chg td{word-break:break-word}.warn{color:var(--warn)}
body[data-theme=light]{--bg:#f4f7f5;--pn:#ffffff;--ln:#c9d6cd;--fg:#14251a;--dim:#5a6e60;--acc:#0b8a3e;--warn:#a86b00;--bad:#c62828;--blue:#1565c0;--or:#d35400}
body[data-theme=light] header,body[data-theme=light] .seat,body[data-theme=light] .it,body[data-theme=light] input,body[data-theme=light] select,body[data-theme=light] textarea{background:#fff}
body[data-theme=light] .seat.chief{background:#fff4ea}body[data-theme=light] button.b{background:#e6f5ec}body[data-theme=light] button.b:hover{background:var(--acc);color:#fff}
body[data-theme=contrast]{--bg:#000;--pn:#000;--ln:#9a9a9a;--fg:#fff;--dim:#d0d0d0;--acc:#00ff66;--warn:#ffd400;--bad:#ff4040;--blue:#59c8ff}
body[data-theme=contrast] header,body[data-theme=contrast] .seat,body[data-theme=contrast] .it{background:#000}
body[data-density=compact] main{padding:6px}body[data-density=compact] .pn{padding:6px}body[data-density=compact] .grid,body[data-density=compact] .seats{gap:5px}
body[data-density=comfy] main{padding:20px}body[data-density=comfy] .pn{padding:16px}body[data-density=comfy] .grid,body[data-density=comfy] .seats{gap:16px}
</style></head><body>
<div class="bar2"><a id="homeBtn" class="home" href="#" data-i18n="back_home"></a><span class="crumb"><span id="crumbHome" data-i18n="home"></span> › <b id="crumbWf"></b></span><span class="dim" style="margin-left:auto;font-size:11px" data-i18n="back_keys"></span></div>
<header><b id="title">▌SeatCrew</b><span class="dim" data-i18n="app_sub"></span><span id="wfname" class="pill"></span><span id="clk" class="dim"></span>
<select id="langSel"></select>
<nav><button data-t="dash" class="act" data-i18n="nav_dash"></button><button data-t="team" data-i18n="nav_seats"></button><button data-t="set" data-i18n="nav_set"></button><button data-t="prof" data-i18n="nav_prof"></button></nav></header>
<main>
<section id="dash" class="tab act">
 <div class="grid g2">
  <div class="pn"><h3 data-i18n="seats_title"></h3><div class="seats" id="seats"></div>
   <div class="runner" id="runner"></div><div class="row" style="justify-content:center"><button class="b sm" id="runNow" data-i18n="run_now"></button><span id="cyc" class="dim"></span></div></div>
  <div class="grid">
   <div class="pn" id="submitPn"><h3 data-i18n="new_item"></h3><div id="form"></div><button class="b" id="submitBtn" data-i18n="submit"></button></div>
   <div id="panels"></div>
   <div class="pn"><h3 data-i18n="log_title"></h3><div id="log"></div></div>
  </div>
 </div>
 <div class="pn" style="margin-top:12px"><h3><span data-i18n="chain_title"></span> <span style="color:var(--bad)" data-i18n="single_point"></span></h3><div class="items" id="items"></div></div>
</section>
<section id="team" class="tab"><div class="pn"><h3 data-i18n="seat_ai_title"></h3><p class="dim" data-i18n="seat_ai_hint"></p><div id="seatcfg"></div>
 <button class="b" id="saveSeats" data-i18n="save"></button> <span id="seatmsg" class="dim"></span>
 <h3 style="margin-top:14px" data-i18n="keys_title"></h3><div id="keys"></div></div></section>
<section id="set" class="tab"><div class="pn"><h3 data-i18n="settings_title"></h3>
 <div class="row"><label data-i18n="language"></label><select id="setLang"></select></div>
 <div class="row"><label data-i18n="interval"></label><input id="interval" type="number" min="5" style="width:90px"> <label><input id="autorun" type="checkbox"> <span data-i18n="auto_run"></span></label></div>
 <h3 style="margin-top:12px" data-i18n="wf_settings"></h3><div id="wfset"></div>
 <button class="b" id="saveSet" data-i18n="save"></button> <span id="setmsg" class="dim"></span></div></section>
<section id="prof" class="tab"><div class="pn"><h3 data-i18n="prof_title"></h3><p class="dim" data-i18n="prof_hint"></p>
 <div class="row"><label data-i18n="profile"></label><select id="profSel"></select><button class="b sm" id="profLoad" data-i18n="load"></button><button class="b sm no" id="profDel" data-i18n="delete"></button>
  <span style="margin-left:14px"></span><input id="profName" data-i18n-ph="profile_name" style="width:160px"><button class="b sm" id="profSave" data-i18n="save_as"></button>
  <button class="b sm" id="profApply" data-i18n="apply"></button><button class="b sm no" id="profReset" data-i18n="reset"></button>
  <span style="margin-left:14px"></span><button class="b sm" id="profExport" data-i18n="export"></button><button class="b sm" id="profImport" data-i18n="import"></button></div>
 <div class="dim" id="profMsg"></div><div id="editor" style="margin-top:10px"></div>
 <div class="row"><button class="b" id="profApply2" data-i18n="apply"></button><span class="dim" id="profFolder"></span></div></div></section>
</main>
<div class="modal" id="expM"><div class="box"><h3 data-i18n="export_title"></h3><p class="dim" data-i18n="export_hint"></p>
 <div class="row"><label data-i18n="author"></label><input id="expAuthor" style="width:240px"><button class="b sm" id="expRefresh">↻</button></div>
 <div class="row"><b id="expFile"></b><button class="b" id="expDl" data-i18n="download"></button><button class="b" id="expCopy" data-i18n="copy_code"></button></div>
 <textarea id="expCode" readonly style="height:110px;font-size:11px"></textarea><div class="row"><button class="b sm" data-close data-i18n="close"></button></div></div></div>
<div class="modal" id="impM"><div class="box"><h3 data-i18n="import_title"></h3><p class="dim" data-i18n="import_hint"></p>
 <div class="row"><input type="file" id="impFile" accept=".json,.yaml,.yml,.txt"></div><textarea id="impText" style="height:110px;font-size:11px" placeholder="SC1.… / { &quot;seatcrew_profile&quot;: 1, … }"></textarea>
 <div class="row"><button class="b" id="impPrev" data-i18n="preview"></button><button class="b sm" data-close data-i18n="cancel"></button></div>
 <div id="impOut"></div></div></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=u=>fetch(u).then(r=>r.json()),post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
let LOC={},META=null,DEF=null;
function T(k,v){let s=LOC[k]??k;for(const x in v||{})s=s.replace('{'+x+'}',v[x]);return s}
const job=s=>LOC['seat_'+s.name]||s.job;
function toast(m){$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
async function setLang(l,save){LOC=await get('/api/locale/'+l);document.documentElement.lang=l;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=T(e.dataset.i18n));document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=T(e.dataset.i18nPh));if(typeof HOME!='undefined'&&HOME)$('crumbHome').innerHTML=`<a href="${HOME}">${esc(T('home'))}</a>`;
 ['langSel','setLang'].forEach(i=>$(i).value=l);if(save)await post('/api/config',{language:l});renderCfg();tick()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.tab').forEach(x=>x.classList.remove('act'));b.classList.add('act');$(b.dataset.t).classList.add('act')});
['langSel','setLang'].forEach(i=>$(i).onchange=e=>setLang(e.target.value,true));
async function load(){META=await get('/api/config');DEF=META.definition;document.title=DEF.title+' · SeatCrew';$('title').textContent='▌'+DEF.title;$('crumbWf').textContent=DEF.title;$('wfname').textContent=DEF.name;
 const lo=Object.entries(META.languages).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');['langSel','setLang'].forEach(i=>$(i).innerHTML=lo);
 $('submitPn').style.display=DEF.submit.length?'':'none';
 $('form').innerHTML=DEF.submit.map(f=>`<div class="row" style="display:block"><label>${esc(LOC['field_'+f.name]||f.label||f.name)}</label>${f.type=='textarea'?`<textarea data-f="${f.name}"></textarea>`:`<input data-f="${f.name}" style="width:100%">`}</div>`).join('');
 await setLang(META.language||'en',false)}
function renderCfg(){if(!META)return;const P=['rules',...Object.keys(META.providers)];
 $('form').querySelectorAll('[data-f]').forEach(e=>{const f=DEF.submit.find(x=>x.name==e.dataset.f);e.previousElementSibling.textContent=LOC['field_'+f.name]||f.label||f.name});
 $('seatcfg').innerHTML=DEF.seats.map(s=>{const v=META.seats[s.name];return `<div class="agent"><span class="n">${s.name.toUpperCase()}</span> <span class="dim">— ${esc(job(s))}${s.labels.length?' · AI: '+s.labels.join('|')+(s.block_labels.length?' (blocks on '+s.block_labels.join('|')+')':''):''}</span>
  <div class="row"><label>${T('provider')}</label><select data-sp="${s.name}">${P.map(p=>`<option ${p==v.provider?'selected':''}>${p}</option>`).join('')}</select>
  <label>${T('model')}</label><input data-sm="${s.name}" value="${esc(v.model)}" placeholder="default"><button class="b sm" data-st="${s.name}">${T('test')}</button><span id="tr-${s.name}" class="dim"></span></div>
  <textarea data-spr="${s.name}">${esc(v.prompt)}</textarea></div>`}).join('');
 document.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{const n=b.dataset.st,p=document.querySelector(`[data-sp=${n}]`).value;if(p=='rules')return;$('tr-'+n).textContent='…';
  const r=await post('/api/test-connection',{provider:p,model:document.querySelector(`[data-sm=${n}]`).value});$('tr-'+n).textContent=r.ok?`✓ ${r.model} "${r.reply}" ${r.latency_ms}ms`:'✗ '+r.error});
 $('keys').innerHTML=Object.entries(META.keys).map(([k,ok])=>`<span class="pill" style="margin-right:6px;color:${ok?'var(--acc)':'var(--dim)'}">${k}: ${ok?T('key_set'):T('key_missing')}</span>`).join('');
 $('interval').value=META.interval;$('autorun').checked=META.auto_run!==false;$('autorun').parentElement.style.display=META.auto_run==null?'none':'';
 $('wfset').innerHTML=Object.entries(META.settings||{}).map(([k,v])=>`<div class="row"><label style="min-width:200px">${esc(LOC['set_'+k]||k)}</label>${typeof v=='boolean'?`<input type=checkbox data-ws="${k}" data-ty="b" ${v?'checked':''}>`:Array.isArray(v)?`<input data-ws="${k}" data-ty="l" value="${esc(v.join(', '))}" style="width:420px">`:`<input data-ws="${k}" data-ty="${typeof v=='number'?'n':'s'}" value="${esc(v)}">`}</div>`).join('')}
$('saveSeats').onclick=async()=>{const seats={};DEF.seats.forEach(s=>seats[s.name]={provider:document.querySelector(`[data-sp=${s.name}]`).value,model:document.querySelector(`[data-sm=${s.name}]`).value.trim(),prompt:document.querySelector(`[data-spr=${s.name}]`).value});
 const r=await post('/api/config',{seats});$('seatmsg').textContent=r.ok?T('saved'):'✗ '+r.error;if(r.ok){META=await get('/api/config');renderCfg()}};
$('saveSet').onclick=async()=>{const settings={};document.querySelectorAll('[data-ws]').forEach(e=>{const t=e.dataset.ty;settings[e.dataset.ws]=t=='b'?e.checked:t=='l'?e.value.split(',').map(x=>x.trim()).filter(Boolean):t=='n'?+e.value:e.value});
 const b={interval:+$('interval').value};if(META.auto_run!=null)b.auto_run=$('autorun').checked;if(Object.keys(settings).length)b.settings=settings;
 const r=await post('/api/config',b);$('setmsg').textContent=r.ok?T('saved'):'✗ '+r.error;if(r.ok){META=await get('/api/config');renderCfg()}};
$('runNow').onclick=()=>post('/api/run',{}).then(()=>toast(T('run_now')+' ✓'));
$('submitBtn').onclick=async()=>{const data={};$('form').querySelectorAll('[data-f]').forEach(e=>data[e.dataset.f]=e.value);const r=await post('/api/submit',{data});
 if(r.ok){$('form').querySelectorAll('[data-f]').forEach(e=>e.value='');toast('#'+r.id+' ✓')}else toast('✗ '+r.error)};
async function decide(id,ok){const r=await post('/api/decide',{id,approve:ok,note:(document.querySelector(`[data-note="${id}"]`)||{}).value||''});if(!r.ok)toast('✗ '+r.error);tick()}
function itemCard(o){const ch=o.chain||[],bl=ch.find(c=>!c.ok),wait=o.pending!=null,ws=wait?DEF.chain[o.pending]:null;
 const st=bl?`<div class="stat bad">${T('blocked_at')} ${bl.seat.toUpperCase()}</div>`:wait?`<div class="stat wait">${T('waiting_at')} ${ws.toUpperCase()}</div>`:/^(done|filled)$/.test(o.status)?`<div class="stat good">✓ ${T('status_done')}</div>`:`<div class="dim">${esc(o.status)}</div>`;
 const tl=DEF.chain.map(k=>{const c=ch.find(x=>x.seat==k),s=DEF.seats.find(x=>x.name==k);
  if(c)return `<div class="st ${c.ok?'':'bad'}"><b>${k.toUpperCase()}</b> <span class="${c.ok?'ok':'bad'}">${c.ok?T('check_ok'):'<b>'+T('check_blocked')+'</b>'}</span><div class="rs">${esc(c.reason)}</div></div>`;
  if(k==ws)return `<div class="st wait"><b>${k.toUpperCase()}</b> <span class="wait"><b>${T('waiting')}</b></span><div class="row"><input data-note="${o.id}" placeholder="${T('note')}" style="width:120px"><button class="b sm" data-ap="${o.id}">${T('approve')}</button><button class="b sm no" data-rj="${o.id}">${T('reject')}</button></div></div>`;
  return `<div class="st pend"><b>${k.toUpperCase()}</b> <span class="rs">${esc(job(s))}</span></div>`}).join('');
 return `<div class="it" data-item="${o.id}"><h4>#${o.id} ${esc(o.title)} <span class="dim">· ${esc(o.label||o.subject||'')}</span></h4>${st}<div class="tl">${tl}</div></div>`}
let busy=false;
async function tick(){if(!DEF||!LOC.app_sub||busy)return;if(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.note)return;let s;try{s=await get('/api/state')}catch(e){return}
 $('clk').textContent=s.time.replace('T',' ').slice(0,19);$('runner').textContent=T('runner',{n:s.runner.interval});$('cyc').textContent=` ${T('cycle')} ${s.cycle} · ${T('last')} ${s.last_cycle?s.last_cycle.slice(11,19):'—'}`;
 $('seats').innerHTML=DEF.seats.map(d=>{const a=s.seats[d.name];return `<div class="seat ${d.name=='chief'?'chief':''} ${a.active?'on':''}" data-seat="${d.name}"><span class="dot"></span><div class="code">${d.name.toUpperCase()}${d.kind!='check'?`<span class="tag">${T(d.kind)}</span>`:''}</div><div class="job">${esc(job(d))}</div>
  <div class="ai">AI: ${esc(a.ai)}</div><div class="st">${esc(a.status)} <span class="dim">${esc(a.ts)}</span></div><div class="l" title="${esc(a.last)}">${esc(a.last)}</div></div>`}).join('');
 $('panels').innerHTML=(s.panels||[]).map(p=>`<div class="pn"><h3>${esc(p.title)}</h3><table><tr>${p.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${p.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`).join('');
 $('items').innerHTML=s.items.length?s.items.slice(0,14).map(itemCard).join(''):`<span class="dim">${T('chain_empty')}</span>`;
 document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>decide(+b.dataset.ap,true));document.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>decide(+b.dataset.rj,false));
 $('log').innerHTML=s.events.slice().reverse().map(e=>`<div class="k-${e.kind}"><span class=dim>${e.ts.slice(11,19)}</span> ${e.agent.padEnd(9)} ${e.kind.padEnd(13)} ${esc(e.sym)} ${esc(e.msg)}</div>`).join('')}

// ---------- navigation: big back button, breadcrumb, Esc / Alt+Left ----------
const HOME=(()=>{const h=new URLSearchParams(location.search).get("home");return h&&/^http:\/\/127\.0\.0\.1:\d+\/$/.test(h)?h:null})();
if(HOME){$('homeBtn').href=HOME;$('homeBtn').style.display='inline-flex';$('crumbHome').innerHTML=`<a href="${HOME}">${esc(T('home'))}</a>`}else{$('homeBtn').style.display='none';document.querySelector('[data-i18n=back_keys]').style.display='none'}
function goHome(){if(HOME)location.href=HOME}
document.addEventListener('keydown',e=>{const open=document.querySelector('.modal.open');
 if(e.key=='Escape'){if(open){open.classList.remove('open');return}const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){a.blur();return}goHome()}
 if(e.altKey&&e.key=='ArrowLeft'){e.preventDefault();goHome()}});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('open'));
// ---------- display options ----------
function applyDisplay(d){d=d||{};document.body.dataset.theme=d.theme||'dark';document.body.dataset.density=d.density||'normal';document.body.style.fontSize=(d.font_size||13)+'px'}
// ---------- profiles / parameter editor ----------
let PROF=null;
const lab=k=>LOC['p_'+k]||LOC['set_'+k]||k.replace(/_/g,' ');
function fld(p,v){const k=p.split('.').pop(),a=`data-pp="${esc(p)}"`;
 if(p=='language')return `<select ${a} data-ty=s>${Object.entries(META.languages).map(([c,n])=>`<option value="${c}" ${c==v?'selected':''}>${n}</option>`).join('')}</select>`;
 if(p=='display.theme'||p=='display.density')return `<select ${a} data-ty=s>${(p.endsWith('theme')?PROF.themes:PROF.densities).map(x=>`<option ${x==v?'selected':''} value="${x}">${esc(LOC['opt_'+x]||x)}</option>`).join('')}</select>`;
 if(k=='provider'&&p.startsWith('seats.'))return `<select ${a} data-ty=s>${['rules',...Object.keys(META.providers)].map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
 if(typeof v=='boolean')return `<input type=checkbox ${a} data-ty=b ${v?'checked':''}>`;
 if(typeof v=='number')return `<input type=number step=any ${a} data-ty=n value="${v}" ${p=='display.font_size'?'min=10 max=22':''}>`;
 if(v===null)return `<input ${a} data-ty=z value="">`;
 if(Array.isArray(v))return v.every(x=>x===null||typeof x!='object')?`<input ${a} data-ty=l data-num="${v.length&&v.every(x=>typeof x=='number')?1:0}" value="${esc(v.join(', '))}" style="width:100%">`:`<textarea ${a} data-ty=j style="height:90px">${esc(JSON.stringify(v,null,1))}</textarea>`;
 if(k=='prompt'||String(v).length>60)return `<textarea ${a} data-ty=s>${esc(v)}</textarea>`;
 return `<input ${a} data-ty=s value="${esc(v)}">`}
function rows(o,path){return Object.entries(o).map(([k,v])=>{const p=path?path+'.'+k:k;
 if(v&&typeof v=='object'&&!Array.isArray(v))return `<fieldset><legend>${esc(path=='seats'?k.toUpperCase():lab(k))}</legend>${rows(v,p)}</fieldset>`;
 return `<div class="row"><label>${esc(lab(k))}</label>${fld(p,v)}</div>`}).join('')}
function renderEditor(d){const order=['display','language','seats','settings'],ks=[...order.filter(k=>k in d),...Object.keys(d).filter(k=>!order.includes(k))];
 $('editor').innerHTML=ks.map((k,i)=>{const v=d[k];const body=v&&typeof v=='object'&&!Array.isArray(v)?rows(v,k):`<div class="row"><label>${esc(lab(k))}</label>${fld(k,v)}</div>`;
  return `<details class="sec" ${i<3?'open':''} data-sec="${k}"><summary>${esc(LOC['sec_'+k]||lab(k))}</summary>${body}</details>`}).join('')}
function collect(){const out={};let bad=0;document.querySelectorAll('#editor [data-pp]').forEach(e=>{e.classList.remove('err');let v;const t=e.dataset.ty;
  try{if(t=='b')v=e.checked;else if(t=='n'){v=e.value.trim()===''?NaN:+e.value;if(!isFinite(v))throw 0;if(e.min&&v<+e.min||e.max&&v>+e.max)throw 0}
   else if(t=='l'){v=e.value.split(',').map(x=>x.trim()).filter(Boolean);if(e.dataset.num=='1'){v=v.map(Number);if(v.some(x=>!isFinite(x)))throw 0}}
   else if(t=='j')v=JSON.parse(e.value);else if(t=='z')v=e.value.trim()||null;else v=e.value}catch(_){bad++;e.classList.add('err');return}
  const ps=e.dataset.pp.split('.');let o=out;ps.slice(0,-1).forEach(x=>o=o[x]=o[x]||{});o[ps.at(-1)]=v});
 if(bad){profMsg('✗ '+T('invalid')+' ('+bad+')');return null}return out}
function profMsg(m,w){$('profMsg').innerHTML=esc(m)+(w&&w.length?'<div class="warn">'+w.map(esc).join('<br>')+'</div>':'')}
async function loadProf(sel){PROF=await get('/api/profiles');$('profSel').innerHTML=`<option value="">— ${esc(T('current'))} —</option>`+PROF.profiles.map(n=>`<option ${n==sel?'selected':''}>${esc(n)}</option>`).join('');
 $('profFolder').textContent=T('saved_in')+' '+PROF.folder;renderEditor(PROF.current);applyDisplay(PROF.current.display)}
async function afterChange(r,msg,sel){if(!r.ok){profMsg('✗ '+r.error);return}META=await get('/api/config');if(META.language)await setLang(META.language,false);await loadProf(sel);profMsg('✓ '+msg,r.warnings)}
$('profApply').onclick=$('profApply2').onclick=async()=>{const d=collect();if(d)afterChange(await post('/api/profiles/apply',{data:d}),T('saved'))};
$('profSave').onclick=async()=>{const n=$('profName').value.trim()||$('profSel').value;if(!n){$('profName').classList.add('err');return}const d=collect();if(d)afterChange(await post('/api/profiles/save',{name:n,data:d}),T('saved')+': '+n,n)};
$('profLoad').onclick=async()=>{const n=$('profSel').value;if(n)afterChange(await post('/api/profiles/load',{name:n}),T('load')+': '+n,n)};
$('profDel').onclick=async()=>{const n=$('profSel').value;if(n&&confirm(T('confirm_delete',{name:n})))afterChange(await post('/api/profiles/delete',{name:n}),T('delete')+': '+n)};
$('profReset').onclick=async()=>{if(confirm(T('confirm_reset')))afterChange(await post('/api/profiles/reset',{}),T('reset'))};
let EXP=null;
async function doExport(){const n=$('profSel').value,b={name:n,author:$('expAuthor').value};if(!n){const d=collect();if(!d)return;b.data=d}
 EXP=await post('/api/profiles/export',b);if(!EXP.ok){toast('✗ '+EXP.error);return}$('expFile').textContent=EXP.filename;$('expCode').value=EXP.code;$('expM').classList.add('open')}
$('profExport').onclick=doExport;$('expRefresh').onclick=doExport;
$('expDl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(EXP.file,null,2)],{type:'application/json'}));a.download=EXP.filename;a.click()};
$('expCopy').onclick=async()=>{$('expCode').select();try{await navigator.clipboard.writeText(EXP.code)}catch(_){document.execCommand('copy')}toast(T('copied'))};
$('profImport').onclick=()=>{$('impOut').innerHTML='';$('impM').classList.add('open')};
$('impFile').onchange=async e=>{const f=e.target.files[0];if(f)$('impText').value=await f.text()};
const fmt=v=>v===undefined||v===null?'—':typeof v=='object'?JSON.stringify(v):String(v);
$('impPrev').onclick=async()=>{const r=await post('/api/profiles/preview',{text:$('impText').value});
 if(!r.ok){$('impOut').innerHTML=`<p style="color:var(--bad)">✗ ${esc(r.error)}</p>`;return}
 $('impOut').innerHTML=`<p><b>${esc(r.name)}</b> ${r.author?'· '+esc(r.author):''} · ${esc(r.workflow)} · SeatCrew ${esc(r.app_version||'?')}</p>${r.warnings.map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('')}
  <p>${r.n_changes} ${T('changes')}</p><div class="chg"><table>${r.changes.map(c=>`<tr><td>${esc(c.path)}</td><td class="dim">${esc(fmt(c.from).slice(0,80))}</td><td>→ ${esc(fmt(c.to).slice(0,80))}</td></tr>`).join('')}</table></div>
  <div class="row"><label>${T('profile_name')}</label><input id="impName" value="${esc(r.name)}"><label><input type=checkbox id="impApply" checked> ${T('apply_now')}</label><button class="b" id="impGo">${T('confirm_import')}</button></div>`;
 $('impGo').onclick=async()=>{const x=await post('/api/profiles/import',{text:$('impText').value,name:$('impName').value,apply:$('impApply').checked});
  if(!x.ok){toast('✗ '+x.error);return}$('impM').classList.remove('open');afterChange({ok:true},T('imported',{name:x.name}),x.name)}};
document.querySelector('nav button[data-t=prof]').addEventListener('click',()=>loadProf($('profSel').value));

load().then(()=>{applyDisplay(META.display);loadProf()});setInterval(tick,2000);

</script></body></html>
