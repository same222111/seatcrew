[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seatcrew"
version = "0.8.0"
description = "A framework for multi-AI seat workflows: every job gets a seat, every item walks a check chain, any LLM (or plain rules) per seat. Flagship example: TradeCrew paper-trading terminal."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "pyyaml>=6.0", "yfinance>=0.2.40"]
keywords = ["agents", "multi-agent", "workflow", "human-in-the-loop", "paper-trading", "llm", "agents", "backtesting", "trading-terminal"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Office/Business :: Financial :: Investment"]

[project.urls]
Homepage = "https://github.com/same222111/seatcrew"
Issues = "https://github.com/same222111/seatcrew/issues"
Releases = "https://github.com/same222111/seatcrew/releases"

[project.optional-dependencies]
dev = ["pytest>=7"]
desktop = ["pywebview>=5.0"]
video = ["edge-tts>=7"]

[project.scripts]
seatcrew = "seatcrew.cli:main"
seatcrew-desktop = "seatcrew.desktop:main"
tradecrew = "tradecrew.cli:main"

[tool.setuptools]
packages = ["seatcrew", "tradecrew", "seatcrew_examples"]
package-dir = {"tradecrew" = "examples/trading/tradecrew", "seatcrew_examples" = "examples"}

[tool.setuptools.package-data]
seatcrew = ["web/*.html", "web/*.css", "web/*.js", "locales/*.json", "templates/*", "assets/*", "video/fonts/*"]
tradecrew = ["web/*.html", "locales/*.json"]
seatcrew_examples = ["*/*.py", "*/*.yaml", "*/locales/*.json", "*/profiles/*.json"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests", "examples"]
pythonpath = [".", "examples/trading"]
